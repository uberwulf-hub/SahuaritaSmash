# Builds the signed release .apk (SahuaritaSmashSE-android.apk). Called by every Release, or run on its
# own from Actions > Android > Run workflow to get a test build.
#
# Signing: Android only installs an update over an older copy if both were signed with the same key. Where the key
# comes from, first found:
#   1. the ANDROID_KEYSTORE_BASE64 / _ALIAS / _PASSWORD secrets, if someone set them;
#   2. keys/sahuaritasmash-release.keystore.enc, the key locked with the BACKUP_PASSPHRASE secret ('Keep the Android
#      key in the repository' puts it there, from the cache, and deletes the cached copy);
#   3. only while the repository is private: the key the first build made, kept in the Actions cache.
# A public repository never uses the cache (other people's pull requests can reach it), and no unlocked key is ever
# cached or uploaded.
name: Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # .NET for Android builds on Windows here, like the Build workflow
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install the .NET Android workload
        run: dotnet workload install android
      - name: Android SDK platform 36
        shell: pwsh
        run: |
          $sm = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          'y' * 20 -split '' | & $sm.FullName --sdk_root="$env:ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0' | Out-Null
      - name: Build the release .apk
        shell: pwsh
        run: |
          dotnet publish src/SahuaritaSmash.Android/SahuaritaSmash.Android.csproj -c Release -f net10.0-android -o apk-out "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $apk = Get-ChildItem apk-out -Filter *.apk | Sort-Object { $_.Name -notlike '*-Signed.apk' } | Select-Object -First 1
          if (-not $apk) { Write-Error 'No .apk was built.'; exit 1 }
          Copy-Item $apk.FullName app-release.apk
          Get-Item app-release.apk | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: app-release.apk
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: android-unsigned }

      - uses: actions/checkout@v4
        with: { sparse-checkout: keys, path: repo }

      - name: Which key
        id: which
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "key=secrets" >> "$GITHUB_OUTPUT"
          elif [ -f repo/keys/sahuaritasmash-release.keystore.enc ] && [ -n "$PASSPHRASE" ]; then echo "key=locked" >> "$GITHUB_OUTPUT"
          elif [ -f repo/keys/sahuaritasmash-release.keystore.enc ]; then
            echo "::error::The signing key is in keys/ but the BACKUP_PASSPHRASE secret that unlocks it isn't set (pull requests from other people's copies never get it, so they can't sign)."
            exit 1
          elif [ "$IS_PRIVATE" = "true" ]; then echo "key=cache" >> "$GITHUB_OUTPUT"
          else
            echo "::error::This repository is public and has no signing key it can use: run 'Keep the Android key in the repository' first (it needs the BACKUP_PASSPHRASE secret)."
            exit 1
          fi

      # only while the repository is private and the key isn't kept anywhere else: the one the first build made
      - name: Keep the signing key between builds
        if: steps.which.outputs.key == 'cache'
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: sahuaritasmash-android-signing-key-v1

      - name: Set up signing
        env:
          WHICH: ${{ steps.which.outputs.key }}
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          # the unlocked key goes to the runner's temp folder, never into a cache or an upload
          if [ "$WHICH" = "secrets" ]; then
            KS="$RUNNER_TEMP/secret.keystore"
            echo "$KEY_B64" | base64 -d > "$KS"
            ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          elif [ "$WHICH" = "locked" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in repo/keys/sahuaritasmash-release.keystore.enc -out "$KS" -pass env:PASSPHRASE
            ALIAS="sahuaritasmash"; PASS="sahuaritasmash"
            echo "Using the signing key kept (locked) in keys/."
          else
            mkdir -p ~/android-key
            KS=~/android-key/release.keystore; ALIAS="sahuaritasmash"; PASS="sahuaritasmash"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Sahuarita Smash, O=uberwulf, C=US"
              echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
            else
              echo "Using the cached signing key."
            fi
          fi
          { echo "LL_KEYSTORE=$KS"; echo "LL_KEY_ALIAS=$ALIAS"; echo "LL_KEY_PASS=$PASS"; } >> "$GITHUB_ENV"

      - name: Sign it (replaces the build's debug signature)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$LL_KEYSTORE" --ks-key-alias "$LL_KEY_ALIAS" \
            --ks-pass env:LL_KEY_PASS --key-pass env:LL_KEY_PASS \
            --out SahuaritaSmashSE-android.apk app-release.apk
          "$BT/apksigner" verify --print-certs SahuaritaSmashSE-android.apk | tee certs.txt | head -5
          if grep -qi "Android Debug" certs.txt; then echo "::error::Still signed with a debug key."; exit 1; fi
          ls -la SahuaritaSmashSE-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SahuaritaSmashSE-android.apk
